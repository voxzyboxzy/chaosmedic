name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r lab/requirements.txt
      - name: Test the control plane and the lab
        run: PYTHONPATH=backend:. python -m pytest
      - name: Held-out evaluation
        run: PYTHONPATH=backend:. python -m chaosmedic.eval --check --min-accuracy 0.8
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci
      - name: Test the dashboard
        working-directory: frontend
        run: npm test
      - name: Build the dashboard
        working-directory: frontend
        run: npm run build
